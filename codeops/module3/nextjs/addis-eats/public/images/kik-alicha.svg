      <stop offset="0%" stop-color="#422006" />
      <stop offset="100%" stop-color="#1c1917" />
    </radialGradient>
    <radialGradient id="kik-sauce" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#kik-bg)" />
  <circle cx="300" cy="200" r="160" fill="#292524" stroke="#eab308" stroke-width="3" />
