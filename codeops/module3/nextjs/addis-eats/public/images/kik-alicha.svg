  <!-- Split pea lentils stew texture -->
  <circle cx="250" cy="180" r="14" fill="#fde047" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="280" cy="165" r="15" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="320" cy="175" r="16" fill="#fde047" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="350" cy="190" r="14" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="240" cy="215" r="15" fill="#fde047" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="275" cy="225" r="16" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="310" cy="220" r="15" fill="#fde047" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="345" cy="230" r="14" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
  <!-- Sautéed onions and garlic pieces -->
  <ellipse cx="260" cy="195" rx="8" ry="4" fill="#fef9c3" transform="rotate(25 260 195)" />
  <ellipse cx="330" cy="205" rx="9" ry="4" fill="#fef9c3" transform="rotate(-30 330 205)" />
  <ellipse cx="295" cy="190" rx="8" ry="4" fill="#fef9c3" transform="rotate(10 295 190)" />
