<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="tej-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <radialGradient id="golden-wine" cx="45%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#tej-bg)" />
  <!-- Wooden Bar Counter Top -->
  <rect x="0" y="320" width="600" height="80" fill="#292524" />
  <line x1="0" y1="320" x2="600" y2="320" stroke="#78350f" stroke-width="4" />

  <!-- Cast Shadow -->
  <ellipse cx="300" cy="335" rx="75" ry="18" fill="#000000" opacity="0.6" />

  <!-- Traditional Berele (Spherical Bulb Body with Narrow Neck) -->
  <!-- Bulb Fill -->
  <circle cx="300" cy="245" r="75" fill="url(#golden-wine)" stroke="#fef08a" stroke-width="2" />
  
  <!-- Narrow Glass Neck -->
  <path d="M288 175 L288 100 L312 100 L312 175 Z" fill="#ca8a04" opacity="0.4" stroke="#fef08a" stroke-width="2" />
  <!-- Flared Lip at Top -->
  <ellipse cx="300" cy="100" rx="16" ry="6" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />

  <!-- Glass Specular Highlight Curve -->
  <path d="M250 220 Q240 260 270 295" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6" />
  <path d="M292 110 L292 165" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  
  <!-- Effervescent Honey Wine Bubbles -->
  <circle cx="280" cy="240" r="4" fill="#ffffff" opacity="0.7" />
  <circle cx="310" cy="255" r="3" fill="#ffffff" opacity="0.7" />
  <circle cx="295" cy="275" r="5" fill="#ffffff" opacity="0.6" />
  <circle cx="325" cy="235" r="3.5" fill="#ffffff" opacity="0.6" />
  <circle cx="300" cy="210" r="3" fill="#ffffff" opacity="0.7" />

  <!-- Honeycomb Accent Badge -->
  <polygon points="420,170 440,180 440,205 420,215 400,205 400,180" fill="#f59e0b" stroke="#d97706" stroke-width="2" opacity="0.9" />
  <text x="420" y="196" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">100%</text>
  <text x="420" y="207" font-family="sans-serif" font-size="9" font-weight="bold" fill="#78350f" text-anchor="middle">PURE</text>
</svg>
