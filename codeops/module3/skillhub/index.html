<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2L2 7l10 5 10-5-10-5z'/><path d='M2 17l10 5 10-5'/><path d='M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="skiilhub - 100% Free Tech Stack Roadmaps & Verified Learning Resources. Follow structured step-by-step developer paths from beginner to job-ready, build hands-on projects, and track your progress." />
    <title>skiilhub – 100% Free Tech Stack Roadmaps & Learning Platform</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="app-preloader" style="position:fixed;inset:0;background:#0b0f19;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;color:#ffffff;z-index:999999;">
        <div style="position:relative;margin-bottom:1.5rem;">
          <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#3b82f6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;box-shadow:0 0 35px rgba(99,102,241,0.5);">S</div>
        </div>
        <div style="font-size:1.75rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:0.35rem;color:#f8fafc;display:flex;align-items:center;gap:0.5rem;">
          <span>skiilhub</span>
          <span style="font-size:0.7rem;font-weight:700;background:rgba(16,185,129,0.15);color:#10b981;padding:0.15rem 0.5rem;border-radius:9999px;border:1px solid rgba(16,185,129,0.3);">100% Free</span>
        </div>
        <div style="font-size:0.85rem;color:#94a3b8;margin-bottom:1.75rem;text-align:center;">Open Technical Roadmaps & Curated Free Learning</div>
        <div style="width:200px;height:4px;background:rgba(255,255,255,0.08);border-radius:9999px;overflow:hidden;position:relative;margin-bottom:0.75rem;">
          <div style="width:100%;height:100%;background:linear-gradient(90deg,#3b82f6,#6366f1,#10b981);border-radius:9999px;animation:pbar 1.3s infinite ease-in-out;"></div>
        </div>
        <div style="font-size:0.78rem;color:#64748b;font-family:monospace;">Loading learning paths...</div>
        <style>
          @keyframes pbar {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(0%); }
            100% { transform: translateX(100%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
