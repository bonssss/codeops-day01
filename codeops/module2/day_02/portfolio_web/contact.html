    <main>
        <section>
            <h2>Contact Me</h2>
            <p>If you'd like to get in touch, please fill out the form below or contact me directly.</p>

            <p><strong>Email:</strong> <a href="mailto:bonsadesalegn2@gmail.com"
                    style="color: var(--accent-color);">bonsadesalegn2@gmail.com</a></p>
            <p><strong>Phone:</strong> <a href="tel:+251938756685" style="color: var(--accent-color);">+251 938 756 685
                </a></p>

            <form action="#" method="POST" autocomplete="off">
                <div class="form-group">
                    <label for="name">Full Name (Required)</label>
                    <input type="text" id="name" name="name" required minlength="3" placeholder="bonsa">
                </div>

                <div class="form-group">
                    <label for="email">Email Address (Required)</label>
                    <input type="email" id="email" name="email" required placeholder="bonsa@example.com">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number (Optional)</label>
                    <input type="tel" id="phone" name="phone" pattern="[0-9]{10,}" placeholder="0911121314">
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="What is this regarding?">
                </div>

                <div class="form-group">
                    <label for="message">Message (Required, min 20 characters)</label>
                    <textarea id="message" name="message" rows="5" required minlength="20"
                        placeholder="Your message here..."></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
