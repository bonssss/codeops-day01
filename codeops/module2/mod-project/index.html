<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tv Shows</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <h2>Tv Shows</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#shows">Shows</a></li>
            <li><a href="#favorites">Favorites</a></li>
        </ul>
    </nav>

    <header class="page-header">
        <h1>Tv Shows</h1>
        <p>Welcome to our tv shows database!</p>
    </header>

    <main>
        <div class="main-container">
            <form id="search-form" class="search-form">
                <input id="search-input" type="search" placeholder="Search shows..." aria-label="Search shows">
                <button id="search-button" type="submit">Search</button>
                <output id="search-results" class="search-status" aria-live="polite"></output>
            </form>

            <section class="show-section" id="shows">
                <h2>Popular Shows</h2>
                <div class="grid" id="shows-container"></div>
            </section>

            <section class="show-section" id="favorites">
                <h2>Favorites</h2>
                <div class="grid" id="favorites-container"></div>
            </section>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
