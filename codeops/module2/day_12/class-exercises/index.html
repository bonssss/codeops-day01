<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 2 Day 12 Exercises - Currency Converter</title>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        #watchlist li {
            @apply bg-zinc-800 border border-zinc-700 rounded-lg p-3 text-sm font-medium text-zinc-200 flex items-center justify-between shadow-sm transition-all hover:bg-zinc-700 hover:border-zinc-600;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 font-sans antialiased selection:bg-emerald-500/30">

    <div class="w-full max-w-md">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 sm:p-8 shadow-xl">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold tracking-tight text-white">Converter</h1>
                <p class="text-sm text-zinc-400 mt-1 font-medium tracking-wide">ETB EXCHANGE RATES</p>
            </div>
            
            <p id="status" class="text-xs font-medium text-emerald-500 text-center mb-4 h-4 animate-pulse"></p>
            
            <form action="" id="convert-form" class="space-y-5">
                <div class="space-y-2">
                    <label for="amount" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider">Amount (ETB)</label>
                    <input type="number" id="amount" name="amount" value="1" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3.5 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all shadow-inner text-lg font-medium">
                </div>

                <div class="space-y-2">
                    <label for="currency" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider">Convert To</label>
                    <div class="relative">
                        <select name="" id="currency" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3.5 text-zinc-100 appearance-none focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all shadow-inner cursor-pointer text-lg font-medium">
                            <!-- Options filled by JS -->
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-zinc-500">
                            <svg class="fill-current h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>
               
                <div class="flex gap-3 pt-4">
                    <button id="convert-btn" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-emerald-500/20 active:scale-[0.98] transition-all flex justify-center items-center gap-2">
                        <svg class="w-5 h-5 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                        Convert
                    </button>
                    <button type="button" id="watch-btn" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 hover:text-white font-medium py-3.5 px-5 rounded-xl border border-zinc-700 hover:border-zinc-600 shadow-lg active:scale-[0.98] transition-all flex justify-center items-center group" title="Add to Watchlist">
                        <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    </button>
                </div>
            </form>

            <div class="mt-6 p-5 rounded-xl bg-zinc-950 border border-zinc-800 shadow-inner">
                <p class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2">Conversion Result</p>
                <p id="result" class="text-2xl font-bold text-white tracking-tight break-words">1 ETB = ...</p>
            </div>
            
            <div class="mt-8">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Watchlist</h2>
                    <span class="text-[10px] font-bold text-emerald-500 bg-emerald-500/10 px-2 py-1 rounded-md">LIVE</span>
                </div>
                <ul id="watchlist" class="space-y-2">
                    <!-- Watchlist items will appear here -->
                </ul>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
